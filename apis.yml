name: Roost
description: 'Roost is a Sunnyvale, California home-telematics company that helps property
  and casualty insurance carriers modernize homeowners and commercial insurance with
  smart, in-home sensors and monitoring. Its Protection360 commercial loss-prevention
  service and Security360 white-label home-security bundle detect water leaks, extreme
  temperatures, and smoke-alarm events, delivering real-time alerts and risk data to
  insurers, property owners, and third parties. Roost partners with dozens of top P&C
  carriers, but does not publish a public developer API or developer portal; integrations
  are arranged directly with its engineering team.'
